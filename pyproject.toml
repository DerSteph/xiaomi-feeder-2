[project]
name = "xiaomi-feeder-2"
dynamic = ["version"]
description = "Python controller and library for Xiaomi Smart Pet Food Feeder 2 (xiaomi.feeder.iv2001) - Home Assistant & CLI ready"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Stephan Höhn", email = "me@steph.ovh" },
]
requires-python = ">=3.10"
keywords = [
    "xiaomi",
    "miio",
    "miot",
    "pet-feeder",
    "home-assistant",
    "hacs",
    "iot",
    "smart-home",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "python-miio>=0.5.12",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/DerSteph/xiaomi-feeder-2"
Documentation = "https://github.com/DerSteph/xiaomi-feeder-2#readme"
Repository = "https://github.com/DerSteph/xiaomi-feeder-2.git"
Issues = "https://github.com/DerSteph/xiaomi-feeder-2/issues"
Changelog = "https://github.com/DerSteph/xiaomi-feeder-2/releases"

[project.optional-dependencies]
cloud = [
    "micloud>=0.6.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
feeder = "xiaomi_feeder_2.cli:main"
xiaomi-feeder = "xiaomi_feeder_2.cli:main"
xiaomi-feeder-2 = "xiaomi_feeder_2.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.2.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/xiaomi_feeder_2/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/xiaomi_feeder_2"]

[tool.hatch.build.targets.sdist]
include = [
    "src/xiaomi_feeder_2",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
